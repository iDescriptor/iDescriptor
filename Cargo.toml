[package]
name = "idescriptor"
version = "0.6.2"
license = "AGPL-3.0-or-later"
edition = "2024"

[features]
default = []
flatpak = []
appimage = []
package_manager = []
windows_store = []

# Speed up compile times
[profile.dev]
debug = 0

[dependencies]
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io-util"] }
futures = "0.3"
axum = "0.8"
http-range-header = "0.4"
#idevice = { path = "lib/idevice-rs/idevice", features = ["full", "aws-lc"], default-features = false }
idevice = { path = "lib/idevice-rs/idevice", features = ["full", "openssl"], default-features = false }
uuid = { version = "1.22.0", features = ["v4"] }
sha2 = "0.10"
bytemuck = "1.24"
directories = "6"
gstreamer = "0.25.2"
gstreamer-app = "0.25.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
plist = "1.8.0"
plist-macro = "0.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1.21.4"
regex = "1.12.3"
urlencoding = "2.1.3"
serde_json = "1.0.149"
chrono = "0.4.44"
image = { version = "0.25", default-features = false, features = ["png"] }
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-scaling"] }
libheif-rs = { version = "2.6", default-features = false, features = ["v1_17"] }
local-ip-address = "0.6.13"
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
sqlite-vfs = "0.2.0"
filetime = "0.2.27"
priority-queue = "2.7.0"
anyhow = "1.0.102"
# ipatool = { path = "../ipatool-rs", default-features = false }
ipatool = { version = "0.3.2", default-features = false }
cpp = "0.5.11"
cstr = "0.2.12"
qmetaobject = { version = "0.2.10", features = ["log"]}
qttypes     = { version = "0.2.12", default-features = false, features = ["required", "qtquick", "qtquickcontrols2"]}
url = "2.5.8"
oneshot = "0.2.1"
macros = { path = "lib/macros"}
base64 = "0.22.1"
reqwest = { version = "0.13.4", features = ["query"] }
zip = "8.6.0"
log = "0.4.33"
ssh2 = "0.9"
hex = "0.4.3"
irecovery = { version = "0.2.1", features = ["tokio"] }
lru = "0.18.0"
zupdater = { path= "lib/zupdater"}
# izeroconf = { path = "../izeroconf/zeroconf", default-features = false, features = ["pure-rust", "native-backend", "apple-mobile-device-metadata"] }
izeroconf = { git = "https://github.com/uncor3/izeroconf", default-features = false, features = ["pure-rust", "native-backend", "apple-mobile-device-metadata"], rev = "e459d98a89dccd77e959cb45683e42150e46edd6" }
# rsplay = { path = "../rsplay" }
rsplay = { git = "https://github.com/iDescriptor/rsplay", rev = "44f559c8119b07ba9ca3fd274b9b6a29f3fe7c1d" }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
ifuse = { version = "0.1.1", default-features = false, features = ["openssl"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", features = ["futures"] }
dbus-tokio = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSColor", "NSToolbar", "NSView", "NSVisualEffectView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSNotification", "NSObject", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Services"] }

[patch.crates-io]
winfsp = { git = "https://github.com/uncor3/winfsp-rs.git", rev = "23a582913c70f3addc6102344dc9cd539b2bfbe7" }
winfsp-sys = { git = "https://github.com/uncor3/winfsp-rs.git", rev = "23a582913c70f3addc6102344dc9cd539b2bfbe7" }
idevice = { path = "lib/idevice-rs/idevice" }

[build-dependencies]
cpp_build = "0.5.11"
walkdir = "2.5.0"
embed-resource = "3.0"
pkg-config = "0.3.33"
