name: Build Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Build version (e.g., v1.2.3)"
        required: true
        default: "v0.0.0"
  workflow_call:
    inputs:
      version:
        description: "Build version (e.g., v1.2.3)"
        required: true
        type: string
env:
  QT_VERSION: "6.9.3"
  GST_PLUGINS_GOOD_VERSION: "1.26.2"
  LIBPLIST_VER: "2.7.0"

jobs:
  build-windows:
    name: Windows ${{ matrix.asset_arch }}
    environment: release
    permissions:
      actions: read
      contents: read
    env:
      # Manual runs validate the SignPath integration with its self-signed test
      # certificate. Tag builds invoked by build.yml use the release policy.
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ github.event_name == 'workflow_dispatch' && 'test-signing' || vars.SIGNPATH_SIGNING_POLICY_SLUG }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            asset_arch: x86_64
            msystem: mingw64
            msys_prefix: /mingw64
            package_prefix: mingw-w64-x86_64
            rust_toolchain: stable-x86_64-pc-windows-gnu
            wix_arch: x64
            install_qt_action: true
          - runner: windows-11-arm
            asset_arch: arm64
            msystem: clangarm64
            msys_prefix: /clangarm64
            package_prefix: mingw-w64-clang-aarch64
            rust_toolchain: stable-aarch64-pc-windows-gnullvm
            wix_arch: arm64
            install_qt_action: false
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Validate SignPath configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $missing = @()
          if (-not $env:SIGNPATH_API_TOKEN) { $missing += "SIGNPATH_API_TOKEN secret" }
          if (-not $env:SIGNPATH_ORGANIZATION_ID) { $missing += "SIGNPATH_ORGANIZATION_ID secret" }
          if (-not $env:SIGNPATH_PROJECT_SLUG) { $missing += "SIGNPATH_PROJECT_SLUG variable" }
          if (-not $env:SIGNPATH_SIGNING_POLICY_SLUG) { $missing += "SIGNPATH_SIGNING_POLICY_SLUG variable" }
          if (-not $env:SIGNPATH_ARTIFACT_CONFIGURATION_SLUG) { $missing += "SIGNPATH_ARTIFACT_CONFIGURATION_SLUG variable" }

          if ($missing.Count -ne 0) {
            throw "Missing required SignPath configuration: $($missing -join ', ')"
          }

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          release: false
          update: false

      - name: Use msys2 archive
        shell: pwsh
        run: |
          $date = "2025-06-22"
          & "./util/get-msys2-archive.ps1" -Date $date

      - name: Install deps using pacman
        run: |
          target_packages=(
            "${{ matrix.package_prefix }}-cmake"
            "${{ matrix.package_prefix }}-meson"
            "${{ matrix.package_prefix }}-ninja"
            "${{ matrix.package_prefix }}-pkgconf"
            "${{ matrix.package_prefix }}-curl"
            "${{ matrix.package_prefix }}-openssl"
            "${{ matrix.package_prefix }}-libzip"
            "${{ matrix.package_prefix }}-gstreamer"
            "${{ matrix.package_prefix }}-gst-plugins-base"
            "${{ matrix.package_prefix }}-gst-plugins-good"
            "${{ matrix.package_prefix }}-gst-plugins-bad"
            "${{ matrix.package_prefix }}-gst-plugins-ugly"
            "${{ matrix.package_prefix }}-gst-libav"
            "${{ matrix.package_prefix }}-libheif"
            "${{ matrix.package_prefix }}-libarchive"
            "${{ matrix.package_prefix }}-rustup"
            "${{ matrix.package_prefix }}-clang"
            "${{ matrix.package_prefix }}-unicorn"
          )
          if [ "${{ matrix.asset_arch }}" = "x86_64" ]; then
            target_packages+=("${{ matrix.package_prefix }}-gcc")
          else
            target_packages+=(
              "${{ matrix.package_prefix }}-qt6-base"
              "${{ matrix.package_prefix }}-qt6-declarative"
              "${{ matrix.package_prefix }}-qt6-multimedia"
              "${{ matrix.package_prefix }}-qt6-location"
              "${{ matrix.package_prefix }}-qt6-positioning"
              "${{ matrix.package_prefix }}-qt6-serialport"
              "${{ matrix.package_prefix }}-qt6-5compat"
              "${{ matrix.package_prefix }}-qt6-shadertools"
            )
          fi
          pacman -S --needed --noconfirm \
          coreutils \
          base-devel \
          git \
          make \
          libtool \
          autoconf \
          automake-wrapper \
          p7zip \
          "${target_packages[@]}"

      - name: Setup rust toolchain
        run: |
          rustup toolchain install "${{ matrix.rust_toolchain }}"
          rustup default "${{ matrix.rust_toolchain }}"
          rustup toolchain list

      - name: Install Qt
        if: ${{ matrix.install_qt_action }}
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          modules: "qtmultimedia qtlocation qtpositioning qtserialport qt5compat qtshadertools"
          arch: win64_mingw

      - name: Set Environment Variables
        run: |
          if [ "${{ matrix.install_qt_action }}" = "true" ]; then
            qt_root_dir="$(cygpath -au "${Qt6_DIR:?Qt6_DIR is not set}")"
          else
            qt_root_dir="${{ matrix.msys_prefix }}"
            echo "Qt6_DIR=$(cygpath -aw "${qt_root_dir}/lib/cmake/Qt6")" >> "$GITHUB_ENV"
          fi
          echo "QMAKE=${qt_root_dir}/bin/qmake.exe" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_EXECUTABLE=$(cygpath -aw "${{ matrix.msys_prefix }}/bin/pkg-config.exe")" >> "$GITHUB_ENV"

      - name: Install FluentUI
        run: |
          qt_root_dir="$(cygpath -au "${Qt6_DIR:?Qt6_DIR is not set}")"

          git clone https://github.com/uncor3/FluentUI.git
          cd FluentUI
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${qt_root_dir}" \
            -DFLUENTUI_QML_PLUGIN_DIRECTORY="${qt_root_dir}/qml/FluentUI"
          cmake --build build

      - name: Build qml6glsink from gst-plugins-good
        run: |
          qt_root_dir="$(cygpath -au "${Qt6_DIR:?Qt6_DIR is not set}")"

          curl --retry 3 --retry-delay 5 -L \
            -o "gst-plugins-good-${GST_PLUGINS_GOOD_VERSION}.tar.xz" \
            "https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-${GST_PLUGINS_GOOD_VERSION}.tar.xz"
          tar -xf "gst-plugins-good-${GST_PLUGINS_GOOD_VERSION}.tar.xz"
          cd "gst-plugins-good-${GST_PLUGINS_GOOD_VERSION}"

          meson setup build-qml6 . \
            --prefix="${{ matrix.msys_prefix }}" \
            --libdir=lib \
            --auto-features=disabled \
            -Dqt-method=qmake \
            -Dqt6=enabled \
            -Dqt5=disabled \
            -Dtests=disabled \
            -Dexamples=disabled \
            -Dnls=disabled

          ninja -C build-qml6
          cp build-qml6/ext/qt6/libgstqml6.dll "${{ matrix.msys_prefix }}/lib/gstreamer-1.0/"

      - name: Install WinFsp
        shell: pwsh
        run: |
          $maxRetries = 3
          $retryDelaySeconds = 10
          $attempt = 0
          $success = $false

          while ($attempt -lt $maxRetries -and -not $success) {
              $attempt++
              Write-Host "Attempt $attempt to install WinFsp..."
              choco install winfsp -y
              if ($LASTEXITCODE -eq 0) {
                  Write-Host "WinFsp installed successfully on attempt $attempt."
                  $success = $true
              } else {
                  Write-Warning "WinFsp installation failed on attempt $attempt (exit code: $LASTEXITCODE)."
                  if ($attempt -lt $maxRetries) {
                      Write-Host "Retrying in $retryDelaySeconds seconds..."
                      Start-Sleep -Seconds $retryDelaySeconds
                  }
              }
          }

          if (-not $success) {
              Write-Error "Failed to install WinFsp after $maxRetries attempts."
              exit 1 # Explicitly fail the step if all retries fail
          }

      - name: Build
        run: |
          RUSTFLAGS="" cargo build --release

      - name: Deploy portable build
        run: |
          rm -rf target/deploy
          mkdir -p target/deploy
          cp target/release/idescriptor.exe target/deploy/

          qt_root_dir="$(cygpath -au "${Qt6_DIR:?Qt6_DIR is not set}")"
          qml_source_dir="$(cygpath -au "$GITHUB_WORKSPACE")/src/ui"

          pushd target/deploy
          bash ../../packaging/windows/portable/deploy.sh \
            --executable="./idescriptor.exe" \
            --output-dir="./" \
            --qt-bin-path="${qt_root_dir}/bin" \
            --msys2-bin-path="$(cygpath -au "${{ matrix.msys_prefix }}/bin")" \
            --architecture="${{ matrix.wix_arch }}" \
            --project-source-dir="../../" \
            --qml-source-dir="${qml_source_dir}"
          popd

      # - name: Patch Unicorn for Windows ARM64
      #   if: ${{ matrix.asset_arch == 'arm64' }}
      #   run: |
      #     cargo run --release \
      #       --manifest-path ../ipatool-rs/ipatool-core/Cargo.toml \
      #       --bin patch-unicorn-windows-arm64 \
      #       -- target/deploy/libunicorn.dll

      - name: Create portable ZIP
        id: portable_zip
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $zipName = "iDescriptor-$version-Windows_${{ matrix.asset_arch }}.portable.zip"
          if (Test-Path $zipName) {
              Remove-Item $zipName
          }
          Compress-Archive -Path "target\deploy\*" -DestinationPath $zipName -Force
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "zip_path=$((Resolve-Path $zipName).Path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install WiX 4
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          wix extension add WixToolset.UI.wixext/4.0.6
          wix extension add WixToolset.Util.wixext/4.0.6

      - name: Build MSI
        id: msi
        shell: pwsh
        run: |
          $output = "iDescriptor-${{ inputs.version }}-Windows_${{ matrix.asset_arch }}.msi"
          ./packaging/windows/msi/build.ps1 `
            -DeployDir "target/deploy" `
            -Version "${{ inputs.version }}" `
            -OutputPath $output `
            -Architecture "${{ matrix.wix_arch }}"
          "msi_path=$((Resolve-Path $output).Path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload unsigned Windows artifacts for SignPath
        id: signpath_input
        uses: actions/upload-artifact@v4
        with:
          name: signpath-unsigned-windows-${{ matrix.asset_arch }}
          path: |
            ${{ steps.msi.outputs.msi_path }}
            ${{ steps.portable_zip.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows artifacts with SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.signpath_input.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/signpath-signed

      - name: Validate signed Windows artifacts
        id: signed_outputs
        shell: pwsh
        run: |
          $signingPolicy = "${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}"
          $msiName = Split-Path -Leaf "${{ steps.msi.outputs.msi_path }}"
          $zipName = Split-Path -Leaf "${{ steps.portable_zip.outputs.zip_path }}"
          $signedDirectory = Join-Path $env:GITHUB_WORKSPACE "target\signpath-signed"
          $signedMsi = Join-Path $signedDirectory $msiName
          $signedZip = Join-Path $signedDirectory $zipName

          function Assert-AuthenticodeSignature([string]$path) {
            if ($signingPolicy -eq "test-signing") {
              $signature = Get-AuthenticodeSignature -LiteralPath $path
              $status = $signature.Status.ToString()

              if (-not $signature.SignerCertificate) {
                throw "The artifact returned by SignPath is not Authenticode signed: $path"
              }

              # The test certificate is intentionally self-signed and is not in
              # the GitHub runner's trusted roots. Reject missing, damaged, or
              # unsupported signatures while allowing that expected trust error.
              if ($status -notin @("Valid", "NotTrusted", "UnknownError")) {
                throw "The artifact returned by SignPath has an invalid Authenticode signature ($status): $path"
              }

              Write-Host "Test signature found: $path"
              Write-Host "  Status: $status"
              Write-Host "  Status message: $($signature.StatusMessage)"
              Write-Host "  Signer: $($signature.SignerCertificate.Subject)"
              Write-Host "  Thumbprint: $($signature.SignerCertificate.Thumbprint)"
              return
            }

            signtool verify /pa /all /v $path
            if ($LASTEXITCODE -ne 0) {
              throw "The artifact returned by SignPath does not have a valid, trusted Authenticode signature: $path"
            }
          }

          if (-not (Test-Path -LiteralPath $signedMsi -PathType Leaf)) {
            throw "SignPath did not return the expected MSI: $signedMsi"
          }
          if (-not (Test-Path -LiteralPath $signedZip -PathType Leaf)) {
            throw "SignPath did not return the expected portable ZIP: $signedZip"
          }

          Assert-AuthenticodeSignature $signedMsi

          $portableDirectory = Join-Path $env:RUNNER_TEMP "idescriptor-signed-portable"
          Expand-Archive -LiteralPath $signedZip -DestinationPath $portableDirectory -Force
          $signedExecutable = Join-Path $portableDirectory "idescriptor.exe"
          if (-not (Test-Path -LiteralPath $signedExecutable -PathType Leaf)) {
            throw "The portable ZIP returned by SignPath does not contain idescriptor.exe"
          }

          Assert-AuthenticodeSignature $signedExecutable

          "msi_path=$signedMsi" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "zip_path=$signedZip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build Microsoft Store executable
        run: |
          RUSTFLAGS="" cargo build --release --features windows_store
          rm -rf target/store-deploy
          mkdir -p target/store-deploy
          pushd target/deploy
          find . -type f \
            ! -iname '*.ps1' \
            ! -iname '*.bat' \
            ! -iname '*.cmd' \
            -exec cp --parents '{}' ../store-deploy/ \;
          popd
          cp target/release/idescriptor.exe target/store-deploy/idescriptor.exe

      - name: Install MSIX asset tooling
        shell: pwsh
        run: choco install imagemagick.app -y --no-progress

      - name: Build and validate MSIX
        id: msix
        shell: pwsh
        env:
          MS_STORE_IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
          MS_STORE_PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
        run: |
          # TODO: Confirm both values against the final Partner Center product identity.
          $identity = if ($env:MS_STORE_IDENTITY_NAME) { $env:MS_STORE_IDENTITY_NAME } else { "com.idescriptor.idescriptor" }
          $publisher = if ($env:MS_STORE_PUBLISHER) { $env:MS_STORE_PUBLISHER } else { "CN=iDescriptor" }
          $output = "iDescriptor-${{ inputs.version }}-Windows_${{ matrix.asset_arch }}.msix"
          ./packaging/windows/msix/build.ps1 `
            -DeployDir "target/store-deploy" `
            -Version "${{ inputs.version }}" `
            -OutputPath $output `
            -IdentityName $identity `
            -Publisher $publisher `
            -Architecture "${{ matrix.wix_arch }}"
          "msix_path=$((Resolve-Path $output).Path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # FIXME
      # - name: Verify Chocolatey is available
      #   if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
      #   uses: crazy-max/ghaction-chocolatey@v4
      #   with:
      #     args: -v

      # - name: Build Chocolatey package
      #   if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
      #   shell: pwsh
      #   run: |
      #     ./packaging/windows/chocolatey/build.ps1 `
      #       -Version "${{ inputs.version }}" `
      #       -MsiPath "${{ steps.msi.outputs.msi_path }}" `
      #       -OutputDirectory "target/chocolatey"

      - name: Upload Windows MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.asset_arch }}
          path: ${{ steps.signed_outputs.outputs.msi_path }}
          if-no-files-found: error

      - name: Upload Windows portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.asset_arch }}-portable
          path: ${{ steps.signed_outputs.outputs.zip_path }}
          if-no-files-found: error

      - name: Upload Microsoft Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: store-windows-${{ matrix.asset_arch }}
          path: ${{ steps.msix.outputs.msix_path }}
          if-no-files-found: error

      # - name: Upload Chocolatey package
      #   if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: chocolatey-windows-x86_64
      #     path: target/chocolatey/*.nupkg
      #     if-no-files-found: error
